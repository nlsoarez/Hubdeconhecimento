<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub de Conhecimento — Telecom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
/* ── TOKENS ── */
:root {
  --red: #C0392B;
  --red-dim: rgba(192,57,43,0.08);
  --red-mid: rgba(192,57,43,0.18);
  --red-glow: rgba(192,57,43,0.15);
  --green: #1E8449;
  --green-dim: rgba(30,132,73,0.09);
  --blue: #1A6FA8;
  --blue-dim: rgba(26,111,168,0.09);
  --violet: #5B2C8D;
  --violet-dim: rgba(91,44,141,0.09);
  --amber: #C07800;
  --amber-dim: rgba(192,120,0,0.09);
  --font: 'Outfit', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

[data-theme="light"] {
  --bg: #F6F6F8;
  --surface: #FFFFFF;
  --surface-2: #F0F0F4;
  --surface-hover: #FAFAFA;
  --border: #E4E4EA;
  --border-strong: #C8C8D2;
  --text: #0F0F14;
  --text-dim: #46465A;
  --text-muted: #84849A;
  --header-bg: rgba(246,246,248,0.92);
  --bar-fill: rgba(192,57,43,0.06);
  --sh: 0 1px 2px rgba(0,0,0,0.04),0 2px 6px rgba(0,0,0,0.04);
  --sh-md: 0 2px 4px rgba(0,0,0,0.06),0 6px 18px rgba(0,0,0,0.07);
}

[data-theme="dark"] {
  --bg: #0D0D12;
  --surface: #15151E;
  --surface-2: #1C1C26;
  --surface-hover: #1E1E28;
  --border: #23232F;
  --border-strong: #32323E;
  --text: #EEEEF3;
  --text-dim: #9494A8;
  --text-muted: #58586C;
  --header-bg: rgba(13,13,18,0.94);
  --bar-fill: rgba(192,57,43,0.10);
  --sh: 0 1px 2px rgba(0,0,0,0.28),0 2px 6px rgba(0,0,0,0.28);
  --sh-md: 0 2px 4px rgba(0,0,0,0.4),0 6px 18px rgba(0,0,0,0.48);
}

/* ── RESET ── */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;transition:background .25s,color .25s}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer}
input{font-family:var(--font)}

/* ── HEADER ── */
.header{
  position:sticky;top:0;z-index:50;
  background:var(--header-bg);
  backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--border);
  padding:0 20px;height:52px;
}
.header-inner{
  max-width:1080px;margin:0 auto;height:100%;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-icon{
  width:26px;height:26px;border-radius:7px;
  background:var(--red);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:700;font-family:var(--mono);flex-shrink:0;
}
.logo-text{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.logo-text span{color:var(--red)}
.header-actions{display:flex;align-items:center;gap:4px}
.icon-btn{
  width:32px;height:32px;border-radius:7px;
  border:1px solid var(--border);background:transparent;
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  transition:color .15s,border-color .15s,background .15s;
}
.icon-btn:hover{border-color:var(--border-strong);color:var(--text-dim);background:var(--surface-2)}

/* ── LOGIN ── */
.login-page{min-height:100vh;display:flex;flex-direction:column}
.login-top{padding:14px 20px;display:flex;justify-content:flex-end}
.login-center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:380px}

.login-logo{text-align:center;margin-bottom:36px}
.login-logo-icon{
  width:44px;height:44px;border-radius:11px;
  background:var(--red);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:14px;
  color:#fff;font-size:18px;font-weight:700;font-family:var(--mono);
}
.login-title{font-size:19px;font-weight:700;color:var(--text);letter-spacing:-0.02em}
.login-title span{color:var(--red)}
.login-subtitle{color:var(--text-muted);font-size:13px;margin-top:4px}

.tab-bar{
  display:flex;border-radius:8px;
  border:1px solid var(--border);background:var(--surface-2);
  margin-bottom:20px;padding:3px;gap:3px;
}
.tab-btn{
  flex:1;padding:8px 0;border:none;border-radius:5px;
  font-size:13px;font-weight:600;background:transparent;color:var(--text-muted);
  transition:all .15s;
}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--sh)}

.form-group{display:flex;flex-direction:column;gap:10px}
.form-input{
  width:100%;padding:11px 13px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:14px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.form-input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-dim)}
.form-input::placeholder{color:var(--text-muted)}
.form-error{color:var(--red);font-size:12px}

.btn-primary{
  width:100%;padding:11px 0;border-radius:8px;border:none;
  background:var(--red);color:#fff;font-size:14px;font-weight:600;
  letter-spacing:.01em;
  transition:opacity .15s,transform .1s;
}
.btn-primary:hover{opacity:.86}
.btn-primary:active{transform:scale(.99)}

/* ── CATALOG ── */
.page-wrap{max-width:1080px;margin:0 auto}

.hero{padding:32px 20px 16px}
.hero-greeting{
  color:var(--text-muted);font-size:11px;font-family:var(--mono);
  letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;
}
.hero-title{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:4px;letter-spacing:-0.025em}
.hero-title span{color:var(--red)}
.hero-count{color:var(--text-muted);font-size:13px}

.search-wrap{padding:16px 20px 10px;position:relative}
.search-icon{
  position:absolute;left:32px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);pointer-events:none;
}
.search-input{
  width:100%;padding:10px 14px 10px 40px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:14px;outline:none;
  transition:border-color .15s,box-shadow .15s;
  box-shadow:var(--sh);
}
.search-input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-dim)}
.search-input::placeholder{color:var(--text-muted)}

.filters{
  padding:0 20px 14px;
  display:flex;gap:5px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter-btn{
  padding:5px 12px;border-radius:6px;
  border:1px solid transparent;background:transparent;
  color:var(--text-muted);font-size:12px;font-weight:500;
  white-space:nowrap;flex-shrink:0;transition:all .15s;
}
.filter-btn:hover{background:var(--surface-2);color:var(--text-dim);border-color:var(--border)}
.filter-btn.active{background:var(--red-dim);color:var(--red);border-color:var(--red-mid)}

/* ── CARDS ── */
.grid{
  padding:0 20px 56px;
  display:grid;grid-template-columns:1fr;gap:12px;
}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;padding:18px 20px;
  display:flex;flex-direction:column;gap:10px;
  cursor:pointer;
  transition:border-color .15s,box-shadow .15s;
  animation:fadeUp .3s ease both;
  box-shadow:var(--sh);
}
.card:hover{border-color:var(--border-strong);box-shadow:var(--sh-md)}

.card-accent{width:22px;height:3px;border-radius:99px}
.card-title{font-size:14px;font-weight:600;line-height:1.4;letter-spacing:-0.01em}
.card-provider{font-size:11px;font-family:var(--mono);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.card-desc{font-size:13px;color:var(--text-dim);line-height:1.55;flex:1}

.card-tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;font-family:var(--mono);letter-spacing:.2px}

.card-meta{
  display:flex;align-items:center;gap:12px;
  padding-top:10px;border-top:1px solid var(--border);
  font-size:11px;color:var(--text-muted);
}
.meta-item{display:flex;align-items:center;gap:4px}
.badge-free{
  margin-left:auto;padding:2px 7px;border-radius:4px;
  font-size:10px;font-weight:600;font-family:var(--mono);
  background:var(--green-dim);color:var(--green);
}
.card-link{display:flex;align-items:center;gap:4px;color:var(--red);font-size:12px;font-weight:600}

.no-results{text-align:center;padding:56px 16px;color:var(--text-muted)}
.no-results-icon{font-size:28px;margin-bottom:8px}

/* ── FOOTER ── */
.footer{max-width:1080px;margin:0 auto;padding:16px 20px;border-top:1px solid var(--border)}
.footer p{color:var(--text-muted);font-size:11px;font-family:var(--mono)}

/* ── ADMIN ── */
.admin-auth{text-align:center}
.admin-auth .shield{color:var(--red);margin-bottom:20px}
.admin-title{font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:-0.02em}
.admin-subtitle{color:var(--text-dim);font-size:13px;margin-bottom:24px}
.admin-key-input{text-align:center;max-width:280px;margin:0 auto 12px}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:24px}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat-label{color:var(--text-muted);font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:700;font-family:var(--mono);letter-spacing:-0.02em}

.admin-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.admin-tab{
  display:flex;align-items:center;gap:5px;
  padding:8px 14px;border:none;
  font-size:12px;font-weight:500;background:transparent;
  color:var(--text-muted);border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;
}
.admin-tab:hover{color:var(--text-dim)}
.admin-tab.active{color:var(--text);border-bottom-color:var(--red);font-weight:600}

.rank-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:11px 14px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:4px;position:relative;overflow:hidden;
}
.rank-bar{position:absolute;left:0;top:0;bottom:0;background:var(--bar-fill)}
.rank-num{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text-muted);min-width:20px;text-align:right;position:relative}
.rank-info{flex:1;position:relative}
.rank-title{font-size:13px;font-weight:600}
.rank-sub{color:var(--text-muted);font-size:11px;margin-top:1px}
.rank-count{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--red);position:relative}

.user-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:4px}
.user-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.user-name{font-size:13px;font-weight:600}
.user-email{color:var(--text-muted);font-size:12px;margin-top:1px}
.user-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-family:var(--mono);font-weight:600;background:var(--blue-dim);color:var(--blue);white-space:nowrap}
.user-detail{color:var(--text-dim);font-size:11px;margin-top:5px}
.user-date{color:var(--text-muted);font-size:10px;font-family:var(--mono);margin-top:3px}

.log-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:6px;padding:9px 12px;
  display:flex;align-items:center;gap:10px;
  font-size:12px;margin-bottom:3px;
}
.log-time{color:var(--text-muted);font-family:var(--mono);font-size:10px;min-width:62px}
.log-user{font-weight:600}
.log-arrow{color:var(--border-strong)}
.log-course{color:var(--text-dim);flex:1}

.btn-outline{
  padding:6px 12px;border-radius:6px;
  border:1px solid var(--border);background:transparent;
  color:var(--text-dim);font-size:12px;font-weight:500;
  transition:all .15s;
}
.btn-outline:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}

.link-btn{
  background:none;border:none;
  font-family:var(--font);font-size:13px;color:var(--text-muted);padding:0;
  transition:color .15s;
}
.link-btn:hover{color:var(--text)}

.empty-state{color:var(--text-muted);font-size:13px;text-align:center;padding:40px}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── LOADING ── */
.loading-overlay{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.loading-spinner{
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--border);border-top-color:var(--red);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TRACKS ── */
.tracks-section{padding:4px 20px 20px}
.tracks-label{
  color:var(--text-muted);font-size:10px;font-family:var(--mono);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;
}
.tracks-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:640px){.tracks-grid{grid-template-columns:repeat(3,1fr)}}
.track-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:14px 16px;
  transition:border-color .15s;
}
.track-card:hover{border-color:var(--border-strong)}
.track-name{font-size:13px;font-weight:600;margin-bottom:10px;letter-spacing:-0.01em}
.track-bar{height:3px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:6px}
.track-fill{height:100%;background:var(--red);border-radius:99px;transition:width .7s ease}
.track-pct{font-size:10px;font-family:var(--mono);color:var(--text-muted)}

/* ── CARD DONE ── */
.card.done{border-color:rgba(30,132,73,0.28)}
[data-theme="light"] .card.done{background:rgba(30,132,73,0.03)}
[data-theme="dark"]  .card.done{background:rgba(30,132,73,0.05)}

.badge-done{
  padding:2px 7px;border-radius:4px;font-size:10px;
  font-weight:600;font-family:var(--mono);
  background:var(--green-dim);color:var(--green);
}
.btn-conclude{
  padding:4px 10px;border-radius:6px;
  border:1px solid var(--border);background:transparent;
  color:var(--text-muted);font-size:11px;font-weight:500;font-family:var(--font);
  white-space:nowrap;flex-shrink:0;transition:all .15s;
}
.btn-conclude:hover{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.btn-conclude.concluded{border-color:rgba(30,132,73,0.3);background:var(--green-dim);color:var(--green)}
.btn-cert{color:var(--text-muted)}
.btn-cert.has-cert{border-color:rgba(26,111,168,0.3);background:var(--blue-dim);color:var(--blue)}
</style>
</head>
<body data-theme="light">

<!-- ============ LOADING OVERLAY ============ -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="login-logo-icon" style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--red),#B71C1C);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;font-family:var(--mono)">H</div>
  <div class="loading-spinner"></div>
  <p style="color:var(--text-muted);font-size:12px;font-family:var(--mono)">Carregando...</p>
</div>

<!-- ============ LOGIN PAGE ============ -->
<div id="loginPage" class="login-page">
  <div class="login-top">
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn1" title="Alternar tema">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
  <div class="login-center">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-logo-icon">H</div>
        <h1 class="login-title">Hub de <span>Conhecimento</span></h1>
        <p class="login-subtitle">Capacitação em Telecom & Redes Ópticas</p>
      </div>
      <div class="tab-bar">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Entrar</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Cadastrar</button>
      </div>
      <div class="form-group">
        <div id="fieldName" class="hidden">
          <input class="form-input" id="inputName" placeholder="Nome completo">
        </div>
        <input class="form-input" id="inputEmail" placeholder="E-mail">
        <div id="fieldSector" class="hidden">
          <input class="form-input" id="inputSector" placeholder="Setor (ex: COP Rede, NOC...)">
        </div>
        <div id="fieldRole" class="hidden">
          <input class="form-input" id="inputRole" placeholder="Cargo / Função">
        </div>
        <p class="form-error hidden" id="formError"></p>
        <button class="btn-primary" id="formSubmit" onclick="handleFormSubmit()">Acessar Hub</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ CATALOG PAGE ============ -->
<div id="catalogPage" class="hidden">
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">H</div>
        <span class="logo-text">Hub<span> Telecom</span></span>
      </div>
      <div class="header-actions">
        <button class="icon-btn hidden" id="adminBtn" onclick="showPage('admin')" title="Admin">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" title="Tema">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" onclick="handleLogout()" title="Sair">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="page-wrap">
    <div class="hero">
      <p class="hero-greeting" id="heroGreeting">BEM-VINDO</p>
      <h1 class="hero-title">Capacitação em <span>Telecom</span></h1>
      <p class="hero-count" id="heroCount"></p>
    </div>

    <div id="tracksSection" class="tracks-section"></div>

    <div class="search-wrap">
      <span class="search-icon">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input class="search-input" id="searchInput" placeholder="Buscar curso, tecnologia ou plataforma..." oninput="renderCatalog()">
    </div>

    <div class="filters" id="filtersBar"></div>
    <div class="grid" id="catalogGrid"></div>
  </div>

  <footer class="footer">
    <p>Hub de Conhecimento · COP Rede · Claro Brasil · Abril 2026</p>
    <p style="margin-top:4px;color:var(--text-muted);font-size:11px;font-family:var(--mono)">Desenvolvido por Nelson Soares</p>
  </footer>
</div>

<!-- ============ ADMIN PAGE ============ -->
<div id="adminPage" class="hidden">
  <header class="header">
    <div class="header-inner">

function openCertUpload(courseId, event) {
  event.stopPropagation();
  if (!currentUser) return;
  const cert = getCertFile(currentUser.email, courseId);
  if (cert) {
    const [meta, data] = cert.split(",");
    const mime = (meta.match(/data:([^;]+)/) || [])[1] || "application/octet-stream";
    const bytes = atob(data);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: mime }));
    window.open(url, "_blank");
  } else {
    _certUploadTarget = courseId;
    document.getElementById("certFileInput").value = "";
    document.getElementById("certFileInput").click();
  }
}

function handleCertFileSelected(event) {

  if (file.size > 8 * 1024 * 1024) { alert("Arquivo muito grande. Máximo: 8 MB."); return; }

  reader.onload = function(e) {
    saveCertFile(currentUser.email, _certUploadTarget, e.target.result, file.name);
    _certUploadTarget = null;
    renderCatalog();
  };
  reader.readAsDataURL(file);
}

function initStorage(callback) {
  let called = false;
  function done() {
    if (called) return;
    called = true;
    callback();
  }

  function fallback(reason) {
    console.warn("Firebase fallback:", reason);
    _db = null;
    _users = JSON.parse(localStorage.getItem("hub:users") || "{}");
    _logs  = JSON.parse(localStorage.getItem("hub:logs")  || "[]");
    done();
  }

  if (!FIREBASE_CONFIG) { fallback("sem configuração"); return; }

  // Timeout de segurança: se Firebase não responder em 6s, usa localStorage
  const timeout = setTimeout(() => fallback("timeout"), 6000);

  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.database();

    let usersReady = false, logsReady = false;
    function check() {
      if (!usersReady || !logsReady) return;
      clearTimeout(timeout);
      done();
    }

    _db.ref("hub/users").on("value",
      snap => {
        const remote = snap.val() || {};
        if (Object.keys(remote).length === 0) {
          const local = JSON.parse(localStorage.getItem("hub:users") || "{}");
          if (Object.keys(local).length > 0) {
            _users = local;
            _db.ref("hub/users").set(local).catch(console.error);
          } else { _users = {}; }
        } else { _users = remote; }
        if (!usersReady) { usersReady = true; check(); }
      },
      err => { console.error("Firebase users:", err); fallback(err.message); }
    );

    _db.ref("hub/logs").on("value",
      snap => {
        const data = snap.val() || {};
        const remote = Array.isArray(data) ? data : Object.values(data);
        if (remote.length === 0) {
          const local = JSON.parse(localStorage.getItem("hub:logs") || "[]");
          if (local.length > 0) {
            _logs = local;
            const obj = {};
            local.forEach((log, i) => { obj[i] = log; });
            _db.ref("hub/logs").set(obj).catch(console.error);
          } else { _logs = []; }
        } else { _logs = remote; }
        if (!logsReady) { logsReady = true; check(); }
      },
      err => { console.error("Firebase logs:", err); fallback(err.message); }
    );
  } catch (e) {
    fallback(e.message);
  }
}

    saveUsers(users);
    currentUser = u;
    localStorage.setItem("hub:session", email);
    showPage("catalog");
  }
}

    return `
    <div class="card${done?" done":""}" onclick="trackAndOpen('${c.id}','${c.link}')" style="animation-delay:${i*40}ms">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div class="card-accent" style="background:${accent}"></div>
        ${done ? '<span class="badge-done">&#10004; Concluído</span>' : ""}
      </div>
      <div class="card-title">${c.title}</div>
      <div class="card-provider">${c.provider}</div>
      <div class="card-desc">${c.desc}</div>
      <div class="card-tags">${tags}${levelTag}</div>
      <div class="card-meta">
        <span class="meta-item">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          ${c.duration}
        </span>
        <span class="meta-item">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          ${c.format}
        </span>
        <span class="badge-free">GRATUITO</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div class="card-link">
          Acessar curso
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0">
          ${done ? `<button class="btn-conclude btn-cert${hasCert?" has-cert":""}" onclick="openCertUpload('${c.id}',event)" title="${hasCert?"Ver certificado":"Enviar certificado"}">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:inline;vertical-align:middle;margin-right:3px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>${hasCert ? "Ver Cert." : "Cert."}
          </button>` : ""}
          <button class="btn-conclude${done?" concluded":""}" onclick="concludeCourse('${c.id}',event)">
            ${done ? "&#10004; Concluído" : "+ Concluir"}
          </button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function setFilter(f)       { currentFilter = f;       renderCatalog(); }
function setLevelFilter(f)  { currentLevelFilter = f;  renderCatalog(); }
function setVendorFilter(f) { currentVendorFilter = f; renderCatalog(); }

function trackAndOpen(courseId, link) {
  if (!currentUser) return;
  const logs = getLogs();
  logs.push({ email: currentUser.email, name: currentUser.name, courseId, ts: new Date().toISOString() });
  saveLogs(logs);
  window.open(link, "_blank");
}

// ─── ADMIN ───
function checkAdminKey() {
  const val = document.getElementById("adminKeyInput").value;
  if (val === ADMIN_KEY) { adminAuthed = true; renderAdmin(); }
  else { alert("Chave incorreta"); }
}

function renderAdmin() {
  document.getElementById("adminAuth").classList.toggle("hidden", adminAuthed);
  document.getElementById("adminDash").classList.toggle("hidden", !adminAuthed);
  if (!adminAuthed) return;

  const users = Object.values(getUsers());
  const logs  = getLogs();
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = logs.filter(l => l.ts && l.ts.startsWith(today)).length;

  // KPIs novos
  const usersWithProgress = users.filter(u => Object.values(getProgress(u.email)).some(Boolean)).length;
  const allCompleted = users.flatMap(u => Object.entries(getProgress(u.email)).filter(([,v]) => v).map(([k]) => k));
  const completedSet = new Set(allCompleted);
  const neverCompleted = COURSES.filter(c => !completedSet.has(c.id)).length;
  const completionRate = users.length && COURSES.length
    ? Math.round((allCompleted.length / (users.length * COURSES.length)) * 100)
    : 0;

  document.getElementById("statsGrid").innerHTML = [
    { label:"Cadastros",       value: users.length,                       color:"var(--red)"  },
    { label:"Acessos",         value: logs.length,                        color:"#0077C8"     },
    { label:"Cursos",          value: COURSES.length,                     color:"#00A651"     },
    { label:"Hoje",            value: todayCount,                         color:"#F5A623"     },
    { label:"Sem Progresso",   value: users.length - usersWithProgress,   color:"#7B2D8E"     },
    { label:"Nunca Concluídos",value: neverCompleted,                     color:"#F5A623"     },
    { label:"Taxa Conclusão",  value: completionRate + "%",               color:"#00A651"     },
  ].map(s => `
    <div class="stat-card">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value" style="color:${s.color}">${s.value}</div>
    </div>`).join("");

  // Tabs
  const tabs = [
    { key:"overview", label:"Ranking de Aprendizado" },
    { key:"users",    label:"Usuários"               },
    { key:"certs",    label:"Certificados"           },
    { key:"logs",     label:"Log de acessos"         },
  ];
  document.getElementById("adminTabs").innerHTML = tabs.map(tb =>
    `<button class="admin-tab ${adminTab===tb.key?'active':''}" onclick="setAdminTab('${tb.key}')">${tb.label}</button>`
  ).join("");

  const content = document.getElementById("adminContent");

  if (adminTab === "overview") {
    // Ranking por cursos concluídos (aprendizado real)
    const ranked = users.map(u => {
      const completed = Object.values(getProgress(u.email)).filter(Boolean).length;
      return { ...u, completed, points: completed * 10 };
    }).sort((a, b) => b.completed - a.completed);

    if (ranked.length === 0) { content.innerHTML = '<p class="empty-state">Nenhum usuário cadastrado</p>'; return; }
    const max = ranked[0].completed || 1;
    content.innerHTML = ranked.map((u, i) => `
      <div class="rank-item">
        <div class="rank-bar" style="width:${(u.completed/max)*100}%"></div>
        <span class="rank-num">${i+1}</span>
        <div class="rank-info">
          <div class="rank-title">${u.name}</div>
          <div class="rank-sub">${u.completed} curso${u.completed!==1?"s":""} concluído${u.completed!==1?"s":""} · ${u.points} pontos</div>
        </div>
        <span class="rank-count">${u.points}pts</span>
      </div>`).join("");
  }

  else if (adminTab === "users") {
    if (users.length === 0) { content.innerHTML = '<p class="empty-state">Nenhum usuário cadastrado</p>'; return; }
    const uacc = {};
    logs.forEach(l => { uacc[l.email] = (uacc[l.email] || 0) + 1; });
    content.innerHTML = users.map(u => {
      const completed = Object.values(getProgress(u.email)).filter(Boolean).length;
      const points    = getUserPoints(u.email);
      return `
      <div class="user-item">
        <div class="user-top">
          <div>
            <div class="user-name">${u.name}</div>
            <div class="user-email">${u.email}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <span class="user-badge">${uacc[u.email]||0} acessos</span>
            <span style="font-size:10px;font-family:var(--mono);color:var(--green);font-weight:700">${completed} concluídos · ${points}pts</span>
          </div>
        </div>
        ${u.sector||u.role?`<div class="user-detail">${[u.sector,u.role].filter(Boolean).join(" · ")}</div>`:""}
        <div class="user-date">Cadastro: ${u.registeredAt?new Date(u.registeredAt).toLocaleDateString("pt-BR"):"—"}</div>
      </div>`;
    }).join("");
  }

  else if (adminTab === "certs") {
    if (users.length === 0) { content.innerHTML = '<p class="empty-state">Nenhum usuário cadastrado</p>'; return; }
    let found = false;
    const rows = users.map(u => {
      const certEntries = COURSES.map(c => {
        const meta = localStorage.getItem("hub:certmeta:" + u.email + ":" + c.id);
        if (!meta) return null;
        try {
          const m = JSON.parse(meta);
          return { course: c, meta: m };
        } catch { return null; }
      }).filter(Boolean);
      if (certEntries.length === 0) return "";
      found = true;
      return `<div class="user-item">
        <div class="user-top">
          <div>
            <div class="user-name">${u.name}</div>
            <div class="user-email">${u.email}</div>
          </div>
          <span class="user-badge">${certEntries.length} certificado${certEntries.length!==1?"s":""}</span>
        </div>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">
          ${certEntries.map(e => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:var(--surface-2);border-radius:6px;font-size:12px">
              <span style="color:var(--text-dim)">${e.course.title}</span>
              <span style="color:var(--text-muted);font-size:10px;font-family:var(--mono)">${e.meta.uploadedAt ? new Date(e.meta.uploadedAt).toLocaleDateString("pt-BR") : "—"}</span>
            </div>`).join("")}
        </div>
      </div>`;
    }).join("");
    content.innerHTML = found ? rows : '<p class="empty-state">Nenhum certificado enviado ainda</p>';
  }

  else if (adminTab === "logs") {
    let html = "";
    if (logs.length > 0) html += '<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn-outline" onclick="clearLogs()">Limpar logs</button></div>';
    if (logs.length === 0) { content.innerHTML = '<p class="empty-state">Nenhum log registrado</p>'; return; }
    html += [...logs].reverse().slice(0, 100).map(l => {
      const c = COURSES.find(x => x.id === l.courseId);
      const time = l.ts ? new Date(l.ts).toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "—";
      return `
      <div class="log-item">
        <span class="log-time">${time}</span>
        <span class="log-user">${l.name||l.email}</span>
        <span class="log-arrow">→</span>
        <span class="log-course">${c?c.title:l.courseId}</span>
      </div>`;
    }).join("");
    content.innerHTML = html;
  }
}

function setAdminTab(t) { adminTab = t; renderAdmin(); }

function clearLogs() {
  if (confirm("Limpar todos os logs de acesso?")) {
    saveLogs([]);
    renderAdmin();
  }
}

// ─── INIT ───
(function start() {
  initStorage(function () {
    document.getElementById("loadingOverlay").style.display = "none";
    const session = localStorage.getItem("hub:session");
    if (session && _users[session]) {
      currentUser = _users[session];
      showPage("catalog");
    } else {
      showPage("login");
    }
  });
})();
</script>
