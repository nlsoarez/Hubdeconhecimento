<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub de Conhecimento — Telecom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #DA291C;
  --red-dim: rgba(218,41,28,0.1);
  --red-glow: rgba(218,41,28,0.25);
  --green: #00A651;
  --green-dim: rgba(0,166,81,0.1);
  --blue: #0077C8;
  --blue-dim: rgba(0,119,200,0.1);
  --violet: #7B2D8E;
  --violet-dim: rgba(123,45,142,0.1);
  --amber: #F5A623;
  --amber-dim: rgba(245,166,35,0.1);
  --font: 'Outfit', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --radius: 12px;
}

/* LIGHT (default) */
[data-theme="light"] {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --surface-hover: #F5F5F7;
  --border: #E4E4E8;
  --text: #1A1A2E;
  --text-dim: #555568;
  --text-muted: #8E8EA0;
  --header-bg: rgba(255,255,255,0.88);
  --bar-fill: rgba(218,41,28,0.06);
}

[data-theme="dark"] {
  --bg: #0C0C14;
  --surface: #16161F;
  --surface-hover: #1E1E2A;
  --border: #252530;
  --text: #E8E8EC;
  --text-dim: #A0A0B0;
  --text-muted: #606070;
  --header-bg: rgba(12,12,20,0.88);
  --bar-fill: rgba(218,41,28,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
}

/* ── UTILITIES ── */
.hidden { display: none !important; }
button { font-family: var(--font); }
input { font-family: var(--font); }

/* ── HEADER ── */
.header {
  position: sticky; top: 0; z-index: 50;
  background: var(--header-bg);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
}
.header-inner {
  max-width: 960px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
.logo-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--red), #B71C1C);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 14px; font-weight: 800; font-family: var(--mono);
}
.logo-text { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--text); }
.logo-text span { color: var(--red); }

.header-actions { display: flex; align-items: center; gap: 6px; }

.icon-btn {
  width: 34px; height: 34px; border-radius: 8px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.icon-btn:hover { border-color: var(--red); color: var(--red); }

/* ── LOGIN PAGE ── */
.login-page {
  min-height: 100vh; display: flex; flex-direction: column;
}
.login-top { padding: 12px 16px; display: flex; justify-content: flex-end; }
.login-center {
  flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px;
}
.login-box { width: 100%; max-width: 400px; }
.login-logo { text-align: center; margin-bottom: 32px; }
.login-logo-icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: linear-gradient(135deg, var(--red), #B71C1C);
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px var(--red-glow);
  margin-bottom: 12px;
  color: #fff; font-size: 24px; font-weight: 800; font-family: var(--mono);
}
.login-title {
  font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text);
}
.login-title span { color: var(--red); }
.login-subtitle { color: var(--text-muted); font-size: 13px; margin-top: 6px; }

.tab-bar {
  display: flex; border-radius: 10px; overflow: hidden;
  border: 1px solid var(--border); margin-bottom: 24px;
}
.tab-btn {
  flex: 1; padding: 10px 0; border: none; cursor: pointer;
  font-size: 13px; font-weight: 600; background: transparent; color: var(--text-dim);
  transition: all 0.2s;
}
.tab-btn.active { background: var(--red); color: #fff; }

.form-group { display: flex; flex-direction: column; gap: 12px; }
.form-input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 14px; outline: none;
  transition: border-color 0.2s;
}
.form-input:focus { border-color: var(--red); }
.form-input::placeholder { color: var(--text-muted); }

.form-error { color: var(--red); font-size: 12px; }

.btn-primary {
  width: 100%; padding: 13px 0; border-radius: 10px; border: none; cursor: pointer;
  background: var(--red); color: #fff; font-size: 14px; font-weight: 700;
  box-shadow: 0 4px 16px var(--red-glow);
  transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.9; }

/* ── CATALOG ── */
.page-wrap { max-width: 960px; margin: 0 auto; }

.hero { padding: 28px 16px 16px; }
.hero-greeting {
  color: var(--text-muted); font-size: 12px; font-family: var(--mono);
  letter-spacing: 1px; margin-bottom: 4px;
}
.hero-title { font-size: 24px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
.hero-title span { color: var(--red); }
.hero-count { color: var(--text-dim); font-size: 14px; }

.search-wrap { padding: 0 16px 12px; position: relative; }
.search-icon {
  position: absolute; left: 28px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
}
.search-input {
  width: 100%; padding: 11px 14px 11px 40px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 14px; outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--red); }
.search-input::placeholder { color: var(--text-muted); }

.filters {
  padding: 0 16px 20px;
  display: flex; gap: 6px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filter-btn {
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-dim); font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--red); color: var(--red); }
.filter-btn.active {
  border-color: var(--red); background: var(--red-dim); color: var(--red);
}

/* ── CARDS ── */
.grid {
  padding: 0 16px 48px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
@media (min-width: 640px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 20px;
  display: flex; flex-direction: column; gap: 10px;
  cursor: pointer; transition: all 0.2s;
  text-decoration: none; color: inherit;
  animation: fadeUp 0.35s ease both;
}
.card:hover {
  border-color: rgba(218,41,28,0.3);
  background: var(--surface-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
[data-theme="dark"] .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.35); }

.card-accent { width: 32px; height: 3px; border-radius: 2px; }
.card-title { font-size: 15px; font-weight: 700; line-height: 1.35; }
.card-provider {
  font-size: 11px; font-family: var(--mono); color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.card-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; flex: 1; }

.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  padding: 3px 9px; border-radius: 6px;
  font-size: 10px; font-weight: 600; font-family: var(--mono);
  letter-spacing: 0.3px;
}

.card-meta {
  display: flex; align-items: center; gap: 14px;
  padding-top: 10px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-muted);
}
.meta-item { display: flex; align-items: center; gap: 4px; }
.badge-free {
  margin-left: auto; padding: 3px 8px; border-radius: 5px;
  font-size: 10px; font-weight: 700; font-family: var(--mono);
  background: var(--green-dim); color: var(--green);
}
.card-link {
  display: flex; align-items: center; gap: 5px;
  color: var(--red); font-size: 13px; font-weight: 600;
}

.no-results {
  text-align: center; padding: 48px 16px; color: var(--text-muted);
}
.no-results-icon { font-size: 36px; margin-bottom: 8px; }

/* ── FOOTER ── */
.footer {
  max-width: 960px; margin: 0 auto; padding: 16px;
  border-top: 1px solid var(--border); text-align: center;
}
.footer p { color: var(--text-muted); font-size: 11px; font-family: var(--mono); }

/* ── ADMIN ── */
.admin-auth { text-align: center; }
.admin-auth .shield { color: var(--red); margin-bottom: 20px; }
.admin-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.admin-subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
.admin-key-input { text-align: center; max-width: 280px; margin: 0 auto 12px; }

.stats-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  margin-bottom: 24px;
}
@media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
}
.stat-label {
  color: var(--text-muted); font-size: 11px; font-family: var(--mono);
  text-transform: uppercase; margin-bottom: 4px;
}
.stat-value { font-size: 28px; font-weight: 700; font-family: var(--mono); }

.admin-tabs {
  display: flex; gap: 4px; border-bottom: 1px solid var(--border);
  margin-bottom: 20px; overflow-x: auto;
}
.admin-tab {
  display: flex; align-items: center; gap: 5px;
  padding: 8px 14px; border: none; cursor: pointer;
  font-size: 12px; font-weight: 600; background: transparent;
  color: var(--text-dim); border-bottom: 2px solid transparent;
  transition: all 0.2s; white-space: nowrap;
}
.admin-tab.active { color: var(--red); border-bottom-color: var(--red); }

.rank-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 6px; position: relative; overflow: hidden;
}
.rank-bar {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--bar-fill);
}
.rank-num {
  font-family: var(--mono); font-size: 18px; font-weight: 700;
  color: var(--red); min-width: 28px; text-align: right; position: relative;
}
.rank-info { flex: 1; position: relative; }
.rank-title { font-size: 13px; font-weight: 600; }
.rank-sub { color: var(--text-muted); font-size: 11px; }
.rank-count {
  font-family: var(--mono); font-size: 14px; font-weight: 700;
  color: var(--red); position: relative;
}

.user-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 6px;
}
.user-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.user-name { font-size: 14px; font-weight: 600; }
.user-email { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.user-badge {
  padding: 2px 8px; border-radius: 5px; font-size: 10px;
  font-family: var(--mono); font-weight: 600;
  background: var(--blue-dim); color: var(--blue); white-space: nowrap;
}
.user-detail { color: var(--text-dim); font-size: 11px; margin-top: 6px; }
.user-date { color: var(--text-muted); font-size: 10px; font-family: var(--mono); margin-top: 4px; }

.log-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; margin-bottom: 4px;
}
.log-time { color: var(--text-muted); font-family: var(--mono); font-size: 10px; min-width: 62px; }
.log-user { font-weight: 600; }
.log-arrow { color: var(--text-muted); }
.log-course { color: var(--text-dim); flex: 1; }

.btn-outline {
  padding: 6px 14px; border-radius: 8px;
  border: 1px solid rgba(218,41,28,0.3); background: transparent;
  color: var(--red); font-size: 12px; font-weight: 600; cursor: pointer;
}
.btn-outline:hover { background: var(--red-dim); }

.link-btn {
  background: none; border: none; cursor: pointer;
  font-family: var(--font); font-size: 13px; color: var(--text-dim); padding: 0;
}
.link-btn:hover { color: var(--red); }

.empty-state { color: var(--text-muted); font-size: 13px; text-align: center; padding: 32px; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body data-theme="light">

<!-- ============ LOGIN PAGE ============ -->
<div id="loginPage" class="login-page">
  <div class="login-top">
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn1" title="Alternar tema">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
  <div class="login-center">
    <div class="login-box">
      <div class="login-logo">
        <div class="login-logo-icon">H</div>
        <h1 class="login-title">Hub de <span>Conhecimento</span></h1>
        <p class="login-subtitle">Capacitação em Telecom & Redes Ópticas</p>
      </div>
      <div class="tab-bar">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Entrar</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Cadastrar</button>
      </div>
      <div class="form-group">
        <div id="fieldName" class="hidden">
          <input class="form-input" id="inputName" placeholder="Nome completo">
        </div>
        <input class="form-input" id="inputEmail" placeholder="E-mail">
        <div id="fieldSector" class="hidden">
          <input class="form-input" id="inputSector" placeholder="Setor (ex: COP Rede, NOC...)">
        </div>
        <div id="fieldRole" class="hidden">
          <input class="form-input" id="inputRole" placeholder="Cargo / Função">
        </div>
        <p class="form-error hidden" id="formError"></p>
        <button class="btn-primary" id="formSubmit" onclick="handleFormSubmit()">Acessar Hub</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ CATALOG PAGE ============ -->
<div id="catalogPage" class="hidden">
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">H</div>
        <span class="logo-text">Hub<span> Telecom</span></span>
      </div>
      <div class="header-actions">
        <button class="icon-btn hidden" id="adminBtn" onclick="showPage('admin')" title="Admin">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" title="Tema">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" onclick="handleLogout()" title="Sair">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="page-wrap">
    <div class="hero">
      <p class="hero-greeting" id="heroGreeting">BEM-VINDO</p>
      <h1 class="hero-title">Capacitação em <span>Telecom</span></h1>
      <p class="hero-count" id="heroCount"></p>
    </div>

    <div class="search-wrap">
      <span class="search-icon">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input class="search-input" id="searchInput" placeholder="Buscar curso, tecnologia ou plataforma..." oninput="renderCatalog()">
    </div>

    <div class="filters" id="filtersBar"></div>
    <div class="grid" id="catalogGrid"></div>
  </div>

  <footer class="footer">
    <p>Hub de Conhecimento · COP Rede · Claro Brasil · Abril 2026</p>
  </footer>
</div>

<!-- ============ ADMIN PAGE ============ -->
<div id="adminPage" class="hidden">
  <header class="header">
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="link-btn" onclick="showPage('catalog')">← Hub</button>
        <span style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--red)">Admin</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="Tema">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" onclick="handleLogout()" title="Sair">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Admin Auth Gate -->
  <div id="adminAuth" class="login-center">
    <div class="login-box admin-auth">
      <div class="shield">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h2 class="admin-title">Painel Admin</h2>
      <p class="admin-subtitle">Insira a chave de acesso para continuar</p>
      <input class="form-input admin-key-input" id="adminKeyInput" type="password" placeholder="Chave de acesso"
        onkeydown="if(event.key==='Enter')checkAdminKey()">
      <br><br>
      <button class="btn-primary" style="max-width:280px;margin:0 auto" onclick="checkAdminKey()">Autenticar</button>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDash" class="hidden page-wrap" style="padding:20px 16px 48px">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="admin-tabs" id="adminTabs"></div>
    <div id="adminContent"></div>
  </div>
</div>

// ─── DATA ───

  { id:"datacom-gpon", title:"Módulo GPON/OLT — Completo", provider:"Datacom EaD", desc:"65 aulas (~13h) sobre redes GPON. Configuração e operação de OLTs e ONUs Datacom, provisionamento e troubleshooting.", tags:["gpon"], duration:"~13h", format:"EaD", link:"https://ead.datacom.com.br" },

  { id:"intelbras-g16", title:"Técnico: Redes GPON — OLT G16", provider:"Intelbras", desc:"Ativação e configuração na OLT G16: VLANs, profiles DBA/LINE, firmware, backup e provisionamento automático de ONUs.", tags:["gpon"], duration:"~4h", format:"EaD", link:"https://cursos.intelbras.com.br" },
  { id:"elevify-gpon", title:"Treinamento FTTH/GPON", provider:"Elevify + Datacom", desc:"Conceitos de OLT, ONU, splitters, PPPoE e operação de redes GPON. Nível introdutório com carga horária flexível.", tags:["gpon","fibra"], duration:"4–20h", format:"EaD", link:"https://elevify.com.br" },
  { id:"padtec-yt", title:"Padtec Classroom — Série DWDM", provider:"Padtec", desc:"Vídeos técnicos gratuitos: fundamentos DWDM, alternativas de baixo custo e arquiteturas flexíveis. Canal oficial YouTube.", tags:["dwdm"], duration:"~1h cada", format:"Vídeo", link:"https://www.youtube.com/watch?v=DMA9Q07TKKU" },
  { id:"nicbr-dwdm", title:"Tutorial DWDM — Semana de Capacitação", provider:"NIC.br / Ceptro.br", desc:"Multiplexação por divisão de comprimento de onda, gestão espectral e componentes ópticos em redes de longa distância.", tags:["dwdm"], duration:"~3h", format:"Webinar", link:"https://semanacap.bcp.nic.br/" },
  { id:"intelbras-fibra", title:"Trilha Fibra Óptica (5 cursos)", provider:"Intelbras", desc:"Conceitos e aplicações, Introdução Telecom, leitura de projetos, emendas ópticas e rede externa. Trilha completa.", tags:["fibra"], duration:"~35h", format:"EaD", link:"https://cursos.intelbras.com.br" },
  { id:"nicbr-ipv6", title:"IPv6 Básico — EaD", provider:"NIC.br", desc:"Autoaprendizado do protocolo IPv6 com videoaulas, laboratórios em VM e certificado. Já formou mais de 6.500 alunos.", tags:["ipv6"], duration:"~25h", format:"EaD", link:"https://moodle.saladeaula.nic.br" },
  { id:"nicbr-bcop", title:"BCOP — Boas Práticas para Sistemas Autônomos", provider:"NIC.br / Ceptro.br", desc:"BGP, RPKI, IPv6, segurança, PTTs e +30 cenários de risco com soluções passo a passo para provedores.", tags:["ipv6","redes"], duration:"~16h", format:"EaD + Presencial", link:"https://ceptro.br/cursos-eventos/" },
  { id:"nicbr-mpls", title:"MPLS com Switches DmOS", provider:"NIC.br + Datacom", desc:"Configuração e operação de MPLS tradicional e por engenharia de tráfego em switches Datacom DmOS.", tags:["redes"], duration:"~8h", format:"EaD", link:"https://moodle.saladeaula.nic.br" },
  { id:"huawei-ict", title:"Huawei ICT Academy — Cursos Gratuitos", provider:"Huawei + IFs/MEC", desc:"Cursos online gratuitos em parceria com Institutos Federais: Datacom, Cloud, IA, 5G. Certificação HCIA disponível.", tags:["redes"], duration:"Variável", format:"EaD", link:"https://www.gov.br/mec/pt-br/mecplace/solucoes/parcerias/huawei/ict-academy" },
];

const TAG_META = {
  gpon: { label:"GPON/OLT", color:"#DA291C", dim:"var(--red-dim)" },
  dwdm: { label:"DWDM", color:"#7B2D8E", dim:"var(--violet-dim)" },
  fibra: { label:"Fibra Óptica", color:"#00A651", dim:"var(--green-dim)" },
  ipv6: { label:"IPv6", color:"#F5A623", dim:"var(--amber-dim)" },
  redes: { label:"Redes", color:"#0077C8", dim:"var(--blue-dim)" },
};

const FILTERS = [
  { key:"all", label:"Todos" },
  { key:"gpon", label:"GPON" },
  { key:"dwdm", label:"DWDM" },
  { key:"fibra", label:"Fibra" },
  { key:"ipv6", label:"IPv6" },
  { key:"redes", label:"Redes" },
];

const ADMIN_KEY = "coprede2026";

// ─── STATE ───
let currentUser = null;
let currentFilter = "all";
let adminAuthed = false;
let adminTab = "overview";

function getUsers() { try { return JSON.parse(localStorage.getItem("hub:users") || "{}"); } catch { return {}; } }
function saveUsers(u) { localStorage.setItem("hub:users", JSON.stringify(u)); }
function getLogs() { try { return JSON.parse(localStorage.getItem("hub:logs") || "[]"); } catch { return []; } }
function saveLogs(l) { localStorage.setItem("hub:logs", JSON.stringify(l)); }

// ─── THEME ───
function toggleTheme() {
  const t = document.body.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.body.setAttribute("data-theme", t);
  localStorage.setItem("hub:theme", t);
}
(function initTheme() {
  const saved = localStorage.getItem("hub:theme");
  if (saved) document.body.setAttribute("data-theme", saved);
})();

// ─── TABS LOGIN ───
let loginMode = "login";
function switchTab(mode) {
  loginMode = mode;
  document.getElementById("tabLogin").classList.toggle("active", mode === "login");
  document.getElementById("tabRegister").classList.toggle("active", mode === "register");
  document.getElementById("fieldName").classList.toggle("hidden", mode === "login");
  document.getElementById("fieldSector").classList.toggle("hidden", mode === "login");
  document.getElementById("fieldRole").classList.toggle("hidden", mode === "login");
  document.getElementById("formSubmit").textContent = mode === "login" ? "Acessar Hub" : "Criar minha conta";
  document.getElementById("formError").classList.add("hidden");
}

function showError(msg) {
  const el = document.getElementById("formError");
  el.textContent = msg; el.classList.remove("hidden");
}

function handleFormSubmit() {
  document.getElementById("formError").classList.add("hidden");
  const email = document.getElementById("inputEmail").value.toLowerCase().trim();

  if (loginMode === "login") {
    if (!email) { showError("Informe seu e-mail"); return; }
    const users = getUsers();
    if (!users[email]) { showError("E-mail não cadastrado. Faça seu registro."); return; }
    currentUser = users[email];
    localStorage.setItem("hub:session", email);
    showPage("catalog");
  } else {
    const name = document.getElementById("inputName").value.trim();
    const sector = document.getElementById("inputSector").value.trim();
    const role = document.getElementById("inputRole").value.trim();
    if (!name || !email) { showError("Nome e e-mail são obrigatórios"); return; }
    const users = getUsers();
    if (users[email]) { showError("E-mail já cadastrado. Faça login."); return; }
    const u = { name, email, sector, role, registeredAt: new Date().toISOString() };
    users[email] = u;
    saveUsers(users);
    currentUser = u;
    localStorage.setItem("hub:session", email);
    showPage("catalog");
  }
}

function handleLogout() {
  currentUser = null;
  localStorage.removeItem("hub:session");
  adminAuthed = false;
  showPage("login");
}

// ─── PAGE ROUTING ───
function showPage(page) {
  document.getElementById("loginPage").classList.toggle("hidden", page !== "login");
  document.getElementById("catalogPage").classList.toggle("hidden", page !== "catalog");
  document.getElementById("adminPage").classList.toggle("hidden", page !== "admin");

  if (page === "catalog") renderCatalog();
  if (page === "admin") renderAdmin();
}

// ─── CATALOG ───
function renderCatalog() {
  if (!currentUser) return;

  // Greeting
  const firstName = currentUser.name ? currentUser.name.split(" ")[0].toUpperCase() : "";
  document.getElementById("heroGreeting").textContent = "BEM-VINDO, " + firstName;

  // Admin button
  const isAdmin = currentUser.email === "nelson" || (currentUser.name || "").toLowerCase().includes("nelson");
  document.getElementById("adminBtn").classList.toggle("hidden", !isAdmin);

  // Filters
  const filtersBar = document.getElementById("filtersBar");
  filtersBar.innerHTML = FILTERS.map(f =>
    `<button class="filter-btn ${currentFilter === f.key ? 'active' : ''}" onclick="setFilter('${f.key}')">${f.label}</button>`
  ).join("");

  // Filter + search
  const search = (document.getElementById("searchInput").value || "").toLowerCase();
  let items = COURSES;
  if (currentFilter !== "all") items = items.filter(c => c.tags.includes(currentFilter));
  if (search) items = items.filter(c =>
    c.title.toLowerCase().includes(search) ||
    c.provider.toLowerCase().includes(search) ||
    c.desc.toLowerCase().includes(search) ||
    c.tags.some(t => t.includes(search))
  );

  document.getElementById("heroCount").textContent = items.length + " cursos gratuitos disponíveis";

  // Grid
  const grid = document.getElementById("catalogGrid");
  if (items.length === 0) {
    grid.innerHTML = '<div class="no-results"><div class="no-results-icon">🔍</div><p>Nenhum curso encontrado</p></div>';
    return;
  }

  grid.innerHTML = items.map((c, i) => {
    const accent = TAG_META[c.tags[0]]?.color || "#DA291C";
    const tags = c.tags.map(t => {
      const m = TAG_META[t];
      return `<span class="tag" style="background:${m.color}15;color:${m.color}">${m.label}</span>`;
    }).join("");

    return `
    <div class="card" onclick="trackAndOpen('${c.id}','${c.link}')" style="animation-delay:${i*40}ms">
      <div class="card-accent" style="background:${accent}"></div>
      <div class="card-title">${c.title}</div>
      <div class="card-provider">${c.provider}</div>
      <div class="card-desc">${c.desc}</div>
      <div class="card-tags">${tags}</div>
      <div class="card-meta">
        <span class="meta-item">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          ${c.duration}
        </span>
        <span class="meta-item">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          ${c.format}
        </span>
        <span class="badge-free">GRATUITO</span>
      </div>
      <div class="card-link">
        Acessar curso
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </div>
    </div>`;
  }).join("");
}

function setFilter(f) { currentFilter = f; renderCatalog(); }

function trackAndOpen(courseId, link) {
  if (!currentUser) return;
  const logs = getLogs();
  logs.push({ email: currentUser.email, name: currentUser.name, courseId, ts: new Date().toISOString() });
  saveLogs(logs);
  window.open(link, "_blank");
}

// ─── ADMIN ───
function checkAdminKey() {
  const val = document.getElementById("adminKeyInput").value;
  if (val === ADMIN_KEY) {
    adminAuthed = true;
    renderAdmin();
  } else {
    alert("Chave incorreta");
  }
}

function renderAdmin() {
  document.getElementById("adminAuth").classList.toggle("hidden", adminAuthed);
  document.getElementById("adminDash").classList.toggle("hidden", !adminAuthed);
  if (!adminAuthed) return;

  const users = Object.values(getUsers());
  const logs = getLogs();
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = logs.filter(l => l.ts && l.ts.startsWith(today)).length;

  // Stats
  document.getElementById("statsGrid").innerHTML = [
    { label:"Cadastros", value:users.length, color:"var(--red)" },
    { label:"Acessos", value:logs.length, color:"#0077C8" },
    { label:"Cursos", value:COURSES.length, color:"#00A651" },
    { label:"Hoje", value:todayCount, color:"#F5A623" },
  ].map(s => `
    <div class="stat-card">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value" style="color:${s.color}">${s.value}</div>
    </div>
  `).join("");

  // Tabs
  const tabs = [
    { key:"overview", label:"Cursos mais acessados" },
    { key:"users", label:"Usuários" },
    { key:"logs", label:"Log de acessos" },
  ];
  document.getElementById("adminTabs").innerHTML = tabs.map(tb =>
    `<button class="admin-tab ${adminTab === tb.key ? 'active' : ''}" onclick="setAdminTab('${tb.key}')">${tb.label}</button>`
  ).join("");

  // Content
  const content = document.getElementById("adminContent");

  if (adminTab === "overview") {
    const acc = {};
    logs.forEach(l => { acc[l.courseId] = (acc[l.courseId] || 0) + 1; });
    const ranked = Object.entries(acc).sort((a, b) => b[1] - a[1]);
    if (ranked.length === 0) { content.innerHTML = '<p class="empty-state">Nenhum acesso registrado ainda</p>'; return; }
    const max = ranked[0][1];
    content.innerHTML = ranked.map(([id, count], i) => {
      const c = COURSES.find(x => x.id === id);
      return `
      <div class="rank-item">
        <div class="rank-bar" style="width:${(count/max)*100}%"></div>
        <span class="rank-num">${i+1}</span>
        <div class="rank-info">
          <div class="rank-title">${c ? c.title : id}</div>
          <div class="rank-sub">${c ? c.provider : ''}</div>
        </div>
        <span class="rank-count">${count}</span>
      </div>`;
    }).join("");
  }

  else if (adminTab === "users") {
    if (users.length === 0) { content.innerHTML = '<p class="empty-state">Nenhum usuário cadastrado</p>'; return; }
    const uacc = {};
    logs.forEach(l => { uacc[l.email] = (uacc[l.email] || 0) + 1; });
    content.innerHTML = users.map(u => `
      <div class="user-item">
        <div class="user-top">
          <div>
            <div class="user-name">${u.name}</div>
            <div class="user-email">${u.email}</div>
          </div>
          <span class="user-badge">${uacc[u.email] || 0} acessos</span>
        </div>
        ${u.sector || u.role ? `<div class="user-detail">${[u.sector, u.role].filter(Boolean).join(' · ')}</div>` : ''}
        <div class="user-date">Cadastro: ${u.registeredAt ? new Date(u.registeredAt).toLocaleDateString('pt-BR') : '—'}</div>
      </div>
    `).join("");
  }

  else if (adminTab === "logs") {
    let html = '';
    if (logs.length > 0) {
      html += '<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn-outline" onclick="clearLogs()">Limpar logs</button></div>';
    }
    if (logs.length === 0) { content.innerHTML = '<p class="empty-state">Nenhum log registrado</p>'; return; }
    html += [...logs].reverse().slice(0, 100).map(l => {
      const c = COURSES.find(x => x.id === l.courseId);
      const time = l.ts ? new Date(l.ts).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
      return `
      <div class="log-item">
        <span class="log-time">${time}</span>
        <span class="log-user">${l.name || l.email}</span>
        <span class="log-arrow">→</span>
        <span class="log-course">${c ? c.title : l.courseId}</span>
      </div>`;
    }).join("");
    content.innerHTML = html;
  }
}

function setAdminTab(t) { adminTab = t; renderAdmin(); }

function clearLogs() {
  if (confirm("Limpar todos os logs de acesso?")) {
    saveLogs([]);
    renderAdmin();
  }
}

// ─── INIT ───
(function init() {
  const session = localStorage.getItem("hub:session");
  const users = getUsers();
  if (session && users[session]) {
    currentUser = users[session];
    showPage("catalog");
  } else {
    showPage("login");
  }
})();
</script>
</body>
</html>
